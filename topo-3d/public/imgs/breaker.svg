<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 断路器：参考图1 风格，方形电箱+开关拨杆 -->
  <rect x="16" y="14" width="68" height="72" rx="4" ry="4"
        fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round" />
  <!-- 内部面板分隔线 -->
  <line x1="50" y1="14" x2="50" y2="86" stroke="#1a3a5c" stroke-width="1.5" />
  <!-- 上方警示三角（黄色） -->
  <path d="M50 28 L42 40 L58 40 Z"
        fill="#ffd966" stroke="#1a3a5c" stroke-width="2" stroke-linejoin="round" />
  <text x="50" y="38" font-family="sans-serif" font-size="10" font-weight="bold"
        text-anchor="middle" fill="#1a3a5c">!</text>
  <!-- 左下方开关（红绿拨杆） -->
  <rect x="22" y="54" width="20" height="22" rx="2" ry="2"
        fill="#ffffff" stroke="#1a3a5c" stroke-width="2" />
  <rect x="26" y="58" width="12" height="6" rx="1" ry="1" fill="#c0392b" />
  <rect x="26" y="66" width="12" height="6" rx="1" ry="1" fill="#3b8c4a" />
  <!-- 右下方开关 -->
  <rect x="58" y="54" width="20" height="22" rx="2" ry="2"
        fill="#ffffff" stroke="#1a3a5c" stroke-width="2" />
  <rect x="62" y="58" width="12" height="6" rx="1" ry="1" fill="#3b8c4a" />
  <rect x="62" y="66" width="12" height="6" rx="1" ry="1" fill="#c0392b" />
</svg>