<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 光伏：参考图1 PV Panel 房子（带光伏板屋顶） -->
  <!-- 房子主体（墙体） -->
  <rect x="20" y="46" width="60" height="44" rx="3" ry="3"
        fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round" />
  <!-- 屋顶梯形（光伏板） -->
  <path d="M14 50 L50 18 L86 50 Z"
        fill="#3b6ea5" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round" />
  <!-- 屋顶光伏板格栅线 -->
  <line x1="30" y1="38" x2="70" y2="38" stroke="#1a3a5c" stroke-width="1.5" />
  <line x1="38" y1="28" x2="62" y2="50" stroke="#1a3a5c" stroke-width="1.5" />
  <line x1="62" y1="28" x2="38" y2="50" stroke="#1a3a5c" stroke-width="1.5" />
  <!-- 门（深色） -->
  <rect x="42" y="66" width="16" height="24" rx="2" ry="2" fill="#1a3a5c" />
  <circle cx="54" cy="78" r="1.5" fill="#ffd966" />
  <!-- 左侧窗户 -->
  <rect x="26" y="56" width="10" height="10" rx="1" ry="1" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5" />
  <line x1="31" y1="56" x2="31" y2="66" stroke="#1a3a5c" stroke-width="1" />
  <line x1="26" y1="61" x2="36" y2="61" stroke="#1a3a5c" stroke-width="1" />
  <!-- 右侧窗户 -->
  <rect x="64" y="56" width="10" height="10" rx="1" ry="1" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5" />
  <line x1="69" y1="56" x2="69" y2="66" stroke="#1a3a5c" stroke-width="1" />
  <line x1="64" y1="61" x2="74" y2="61" stroke="#1a3a5c" stroke-width="1" />
</svg>