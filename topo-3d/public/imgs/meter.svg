<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 双向电表：参考图1 风格，圆形电表+双向箭头 -->
  <circle cx="50" cy="50" r="36" fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" />
  <circle cx="50" cy="50" r="28" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5" />
  <!-- 表盘刻度 -->
  <line x1="50" y1="26" x2="50" y2="30" stroke="#1a3a5c" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="70" x2="50" y2="74" stroke="#1a3a5c" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="50" x2="30" y2="50" stroke="#1a3a5c" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="50" x2="74" y2="50" stroke="#1a3a5c" stroke-width="2" stroke-linecap="round" />
  <!-- 双向箭头（左侧↑ 右侧↓）表示双向计量 -->
  <path d="M40 36 L40 50 L36 50 L42 58 L48 50 L44 50 L44 36 Z"
        fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1" stroke-linejoin="round" />
  <path d="M60 64 L60 50 L56 50 L62 42 L68 50 L64 50 L64 64 Z"
        fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1" stroke-linejoin="round" />
  <!-- 中心轴 -->
  <circle cx="50" cy="50" r="3" fill="#1a3a5c" />
</svg>