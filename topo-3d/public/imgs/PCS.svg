<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- PCS 储能变流器：参考图1 Hybrid Inverter 风格 -->
  <!-- 上方两个手柄/接口椭圆 -->
  <ellipse cx="32" cy="22" rx="10" ry="6" fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" />
  <ellipse cx="68" cy="22" rx="10" ry="6" fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" />
  <!-- 主体圆角方形 -->
  <rect x="14" y="26" width="72" height="56" rx="6" ry="6"
        fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round" />
  <!-- 内部中央圆（带闪电） -->
  <circle cx="50" cy="50" r="14" fill="#ffffff" stroke="#1a3a5c" stroke-width="2" />
  <path d="M52 42 L44 54 L49 54 L47 60 L55 48 L50 48 Z"
        fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1" stroke-linejoin="round" />
  <!-- 底部连接点（左右） -->
  <rect x="24" y="82" width="6" height="10" fill="#1a3a5c" />
  <rect x="70" y="82" width="6" height="10" fill="#1a3a5c" />
</svg>