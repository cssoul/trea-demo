<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <defs>
    <linearGradient id="clusterBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="clusterFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
  </defs>
  <!-- Module body -->
  <rect x="8" y="6" width="34" height="38" rx="3" fill="url(#clusterBody)" stroke="#2d3b57" stroke-width="1.5"/>
  <!-- Top bar -->
  <rect x="8" y="6" width="34" height="5" rx="3" fill="#0a0e1a" stroke="#2d3b57" stroke-width="1.5"/>
  <!-- SOC fill indicator -->
  <rect x="11" y="14" width="28" height="26" rx="1.5" fill="#05080f" stroke="#1f2a40" stroke-width="0.5"/>
  <rect x="12" y="32" width="26" height="7" rx="1" fill="url(#clusterFill)" opacity="0.85"/>
  <!-- Cell dividers -->
  <line x1="20" y1="14" x2="20" y2="40" stroke="#1f2a40" stroke-width="0.5"/>
  <line x1="30" y1="14" x2="30" y2="40" stroke="#1f2a40" stroke-width="0.5"/>
  <!-- Terminals -->
  <rect x="14" y="3" width="4" height="4" rx="0.5" fill="#ffb020"/>
  <rect x="32" y="3" width="4" height="4" rx="0.5" fill="#00d9ff"/>
  <!-- Status LED -->
  <circle cx="37" cy="8.5" r="1.2" fill="#10d97a"/>
</svg>
