<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <defs>
    <linearGradient id="pvPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a5a"/>
      <stop offset="50%" stop-color="#0d2540"/>
      <stop offset="100%" stop-color="#081830"/>
    </linearGradient>
    <linearGradient id="pvFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4a66"/>
      <stop offset="100%" stop-color="#1f2a40"/>
    </linearGradient>
    <filter id="pvGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sun glow behind -->
  <circle cx="35" cy="30" r="28" fill="#ffb020" opacity="0.06"/>
  <circle cx="35" cy="30" r="20" fill="#ffb020" opacity="0.08"/>
  <!-- Panel frame (tilted) -->
  <g transform="rotate(-20 35 32)">
    <rect x="12" y="14" width="46" height="30" rx="1" fill="url(#pvFrame)" stroke="#3d4a66" stroke-width="1.2"/>
    <rect x="14" y="16" width="42" height="26" rx="0.5" fill="url(#pvPanel)"/>
    <!-- Cell grid -->
    <g stroke="#1a3a5a" stroke-width="0.6">
      <line x1="24" y1="16" x2="24" y2="42"/>
      <line x1="35" y1="16" x2="35" y2="42"/>
      <line x1="46" y1="16" x2="46" y2="42"/>
      <line x1="14" y1="24.5" x2="56" y2="24.5"/>
      <line x1="14" y1="33.5" x2="56" y2="33.5"/>
    </g>
    <!-- Glint -->
    <line x1="18" y1="18" x2="30" y2="22" stroke="#00d9ff" stroke-width="0.8" opacity="0.6" filter="url(#pvGlow)"/>
  </g>
  <!-- Stand -->
  <line x1="28" y1="48" x2="28" y2="60" stroke="#2d3b57" stroke-width="2"/>
  <line x1="42" y1="48" x2="42" y2="60" stroke="#2d3b57" stroke-width="2"/>
  <line x1="22" y1="60" x2="48" y2="60" stroke="#2d3b57" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sun rays -->
  <g filter="url(#pvGlow)" stroke="#ffb020" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <line x1="58" y1="8" x2="62" y2="4"/>
    <line x1="62" y1="16" x2="67" y2="16"/>
    <line x1="56" y1="22" x2="60" y2="26"/>
  </g>
</svg>
