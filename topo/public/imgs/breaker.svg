<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <filter id="breakerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Top terminal -->
  <rect x="26" y="4" width="8" height="6" rx="1" fill="#2d3b57" stroke="#3d4a66" stroke-width="1"/>
  <line x1="30" y1="10" x2="30" y2="18" stroke="#5a6b8a" stroke-width="2"/>
  <!-- Fixed contact (top) -->
  <circle cx="30" cy="18" r="2" fill="#1a2236" stroke="#00d9ff" stroke-width="1.2" filter="url(#breakerGlow)"/>
  <!-- Moving contact (angled - open position style but closed here) -->
  <line x1="30" y1="18" x2="30" y2="34" stroke="#00d9ff" stroke-width="2" filter="url(#breakerGlow)"/>
  <!-- Breaker mechanism box -->
  <rect x="22" y="22" width="16" height="14" rx="1" fill="#0d1320" stroke="#2d3b57" stroke-width="1.2"/>
  <rect x="24" y="24" width="12" height="3" rx="0.5" fill="#1a2236"/>
  <!-- Toggle switch indicator -->
  <circle cx="30" cy="32" r="1.5" fill="#10d97a" filter="url(#breakerGlow)"/>
  <!-- Fixed contact (bottom) -->
  <circle cx="30" cy="34" r="2" fill="#1a2236" stroke="#00d9ff" stroke-width="1.2" filter="url(#breakerGlow)"/>
  <line x1="30" y1="34" x2="30" y2="44" stroke="#5a6b8a" stroke-width="2"/>
  <!-- Bottom terminal -->
  <rect x="26" y="44" width="8" height="6" rx="1" fill="#2d3b57" stroke="#3d4a66" stroke-width="1"/>
  <!-- Side label area -->
  <text x="42" y="32" fill="#5a6b8a" font-family="monospace" font-size="5">QF</text>
</svg>
