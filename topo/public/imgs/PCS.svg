<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="pcsBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <filter id="pcsGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Cabinet body -->
  <rect x="10" y="8" width="40" height="44" rx="2" fill="url(#pcsBody)" stroke="#2d3b57" stroke-width="1.5"/>
  <!-- Display screen -->
  <rect x="14" y="12" width="32" height="10" rx="1" fill="#05080f" stroke="#1f2a40" stroke-width="0.5"/>
  <text x="18" y="19" fill="#00d9ff" font-family="monospace" font-size="6" filter="url(#pcsGlow)">PCS</text>
  <!-- AC/DC conversion symbol -->
  <g filter="url(#pcsGlow)" transform="translate(30, 36)">
    <!-- DC side (left) -->
    <line x1="-14" y1="0" x2="-6" y2="0" stroke="#00d9ff" stroke-width="1.5"/>
    <line x1="-12" y1="-3" x2="-12" y2="3" stroke="#00d9ff" stroke-width="1.5"/>
    <line x1="-8" y1="-3" x2="-8" y2="3" stroke="#00d9ff" stroke-width="1.5"/>
    <!-- Triangle (rectifier/inverter) -->
    <path d="M -6,-6 L -6,6 L 4,0 Z" fill="none" stroke="#ffb020" stroke-width="1.5"/>
    <!-- AC side (right) -->
    <path d="M 4,0 Q 7,-4 10,0 T 16,0" fill="none" stroke="#ffb020" stroke-width="1.5"/>
  </g>
  <!-- Ventilation slots -->
  <line x1="14" y1="48" x2="20" y2="48" stroke="#2d3b57" stroke-width="1"/>
  <line x1="24" y1="48" x2="30" y2="48" stroke="#2d3b57" stroke-width="1"/>
  <line x1="34" y1="48" x2="40" y2="48" stroke="#2d3d57" stroke-width="1"/>
  <!-- Status LEDs -->
  <circle cx="42" cy="14" r="1.2" fill="#10d97a"/>
  <circle cx="38" cy="14" r="1.2" fill="#5a6b8a"/>
</svg>
