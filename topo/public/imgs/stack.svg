<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="stackBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="stackCell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0088aa"/>
    </linearGradient>
    <filter id="stackGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer housing -->
  <rect x="10" y="8" width="40" height="44" rx="3" fill="url(#stackBody)" stroke="#2d3b57" stroke-width="1.5"/>
  <rect x="10" y="8" width="40" height="6" rx="3" fill="#0a0e1a" stroke="#2d3b57" stroke-width="1.5"/>
  <!-- Terminal caps -->
  <rect x="14" y="5" width="6" height="4" rx="1" fill="#ffb020"/>
  <rect x="40" y="5" width="6" height="4" rx="1" fill="#00d9ff"/>
  <!-- Battery cells (stacked) -->
  <g filter="url(#stackGlow)">
    <rect x="16" y="18" width="28" height="6" rx="1" fill="url(#stackCell)" opacity="0.9"/>
    <rect x="16" y="27" width="28" height="6" rx="1" fill="url(#stackCell)" opacity="0.75"/>
    <rect x="16" y="36" width="28" height="6" rx="1" fill="url(#stackCell)" opacity="0.6"/>
  </g>
  <!-- Plus/Minus markers -->
  <text x="17" y="23" fill="#fff" font-family="monospace" font-size="6" font-weight="bold">+</text>
  <text x="40" y="23" fill="#fff" font-family="monospace" font-size="6" font-weight="bold">−</text>
  <!-- Status LED -->
  <circle cx="44" cy="11" r="1.5" fill="#10d97a"/>
  <circle cx="44" cy="11" r="2.5" fill="#10d97a" opacity="0.3"/>
</svg>
