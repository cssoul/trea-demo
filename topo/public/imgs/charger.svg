<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 充电桩：参考图1 风格的立柱式充电桩 -->
  <!-- 顶部指示灯条 -->
  <rect x="36" y="10" width="28" height="6" rx="2" ry="2" fill="#3b6ea5" stroke="#1a3a5c" stroke-width="2" />
  <!-- 主体立柱 -->
  <rect x="28" y="16" width="44" height="64" rx="6" ry="6"
        fill="#cfe2f3" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round" />
  <!-- 屏幕 -->
  <rect x="34" y="24" width="32" height="20" rx="2" ry="2" fill="#1a3a5c" />
  <!-- 屏幕内闪电图标 -->
  <path d="M52 27 L46 35 L49 35 L48 41 L54 33 L51 33 Z" fill="#ffd966" />
  <!-- 充电枪插孔（圆孔） -->
  <circle cx="50" cy="56" r="6" fill="#ffffff" stroke="#1a3a5c" stroke-width="2" />
  <circle cx="50" cy="56" r="2" fill="#1a3a5c" />
  <!-- 底部底座 -->
  <rect x="22" y="80" width="56" height="8" rx="2" ry="2" fill="#9aa7b3" stroke="#1a3a5c" stroke-width="2" />
  <!-- 右侧悬垂的充电线 -->
  <path d="M72 50 Q86 56 86 72 L86 88" fill="none" stroke="#1a3a5c" stroke-width="2.5" stroke-linecap="round" />
  <!-- 充电枪头 -->
  <rect x="80" y="78" width="12" height="10" rx="2" ry="2" fill="#ffd966" stroke="#1a3a5c" stroke-width="2" />
</svg>