<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 12" width="200" height="12" preserveAspectRatio="none">
  <defs>
    <linearGradient id="busbarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4a66"/>
      <stop offset="40%" stop-color="#5a6b8a"/>
      <stop offset="60%" stop-color="#5a6b8a"/>
      <stop offset="100%" stop-color="#1f2a40"/>
    </linearGradient>
    <filter id="busbarGlow" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main busbar -->
  <rect x="2" y="3" width="196" height="6" rx="1" fill="url(#busbarGrad)" stroke="#2d3b57" stroke-width="0.5" filter="url(#busbarGlow)"/>
  <!-- Center highlight -->
  <rect x="4" y="4.5" width="192" height="1" fill="#8a99b8" opacity="0.4"/>
  <!-- Connection points -->
  <circle cx="20" cy="6" r="1.5" fill="#00d9ff" opacity="0.8"/>
  <circle cx="100" cy="6" r="1.5" fill="#00d9ff" opacity="0.8"/>
  <circle cx="180" cy="6" r="1.5" fill="#00d9ff" opacity="0.8"/>
</svg>
