<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <linearGradient id="meterBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <radialGradient id="meterDial" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <filter id="meterGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Body -->
  <rect x="8" y="8" width="44" height="44" rx="3" fill="url(#meterBody)" stroke="#2d3b57" stroke-width="1.5"/>
  <!-- Dial circle -->
  <circle cx="30" cy="28" r="14" fill="url(#meterDial)" stroke="#2d3b57" stroke-width="1"/>
  <!-- Scale ticks -->
  <g stroke="#5a6b8a" stroke-width="0.8">
    <line x1="30" y1="16" x2="30" y2="18.5"/>
    <line x1="42" y1="28" x2="39.5" y2="28"/>
    <line x1="30" y1="40" x2="30" y2="37.5"/>
    <line x1="18" y1="28" x2="20.5" y2="28"/>
  </g>
  <!-- Bidirectional arrows (charge/discharge) -->
  <g filter="url(#meterGlow)">
    <path d="M 22,28 L 30,22" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <path d="M 28,21 L 31,21 L 31,24" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <path d="M 38,28 L 30,34" fill="none" stroke="#ffb020" stroke-width="1.5"/>
    <path d="M 32,35 L 29,35 L 29,32" fill="none" stroke="#ffb020" stroke-width="1.5"/>
  </g>
  <!-- Center pivot -->
  <circle cx="30" cy="28" r="1.5" fill="#00d9ff" filter="url(#meterGlow)"/>
  <!-- Digital display -->
  <rect x="18" y="42" width="24" height="6" rx="1" fill="#05080f" stroke="#1f2a40" stroke-width="0.5"/>
  <text x="22" y="46.8" fill="#10d97a" font-family="monospace" font-size="5" filter="url(#meterGlow)">220V</text>
  <!-- Status LED -->
  <circle cx="44" cy="12" r="1.2" fill="#10d97a"/>
</svg>
